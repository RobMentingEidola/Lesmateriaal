<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cicero Woordenbattle – Klas 5 Latijn</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 95vh;
      box-sizing: border-box;
      user-select: none;
    }
    .quiz-box {
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 20px;
      max-width: 850px;
      width: 100%;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background-color: #f59e0b;
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 999px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 32px;
      color: #ffffff;
    }
    p.sub {
      color: #94a3b8;
      font-size: 16px;
      margin: 0 0 20px 0;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      background-color: #0f172a;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
      border: 1px solid #334155;
    }
    .stats span { color: #f59e0b; }
    .word-box {
      background-color: #0f172a;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 25px 15px;
      margin-bottom: 20px;
    }
    .word-target {
      font-size: 42px;
      font-weight: 800;
      color: #fbbf24;
    }
    .word-context {
      font-size: 16px;
      color: #94a3b8;
      margin-top: 8px;
      font-style: italic;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }
    .opt-btn {
      background-color: #0f172a;
      border: 2px solid #475569;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 18px 12px;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      transition: background 0.1s;
    }
    .opt-btn:hover:not(:disabled) {
      background-color: #334155;
      border-color: #f59e0b;
    }
    .correct-btn {
      background-color: #10b981 !important;
      border-color: #059669 !important;
      color: #ffffff !important;
    }
    .wrong-btn {
      background-color: #ef4444 !important;
      border-color: #dc2626 !important;
      color: #ffffff !important;
    }
    .feedback {
      font-size: 20px;
      font-weight: bold;
      min-height: 30px;
      margin: 10px 0;
    }
    .btn-next {
      background-color: #3b82f6;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 36px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-next:hover {
      background-color: #2563eb;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background-color: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 20px;
    }
    .progress-bar-inner {
      height: 100%;
      background-color: #f59e0b;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="quiz-box">
    <div class="badge">Klas 5 Gymnasium Latijn</div>
    <h1>🏛️ Cicero Woordenbattle</h1>
    <p class="sub">Exordium (§ 1–2 & § 5–6)</p>

    <!-- DIRECT ACTIVE GAME -->
    <div id="game-container">
      <div class="stats">
        <div>Vraag: <span id="lbl-q">1 / 15</span></div>
        <div>Score: <span id="lbl-score">0</span></div>
        <div>Streak: <span id="lbl-streak">🔥 0</span></div>
      </div>

      <div class="word-box">
        <div class="word-target" id="lbl-word">...</div>
        <div class="word-context" id="lbl-context">...</div>
      </div>

      <div class="grid" id="opt-grid"></div>

      <div class="feedback" id="lbl-feedback"></div>

      <button id="next-btn" class="btn-next" type="button" style="display:none;" onclick="goNext()">Volgende Woord ➔</button>

      <div class="progress-bar-wrap">
        <div id="p-bar" class="progress-bar-inner"></div>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="end-container" style="display:none;">
      <h2 style="font-size:32px; margin-top:20px;">🏆 Battle Voltooid!</h2>
      <div style="font-size: 56px; font-weight: 800; color: #f59e0b; margin: 20px 0;" id="lbl-final-score">0</div>
      <p style="font-size:22px; color:#94a3b8;" id="lbl-eval">Uitstekend!</p>
      <button class="btn-next" type="button" onclick="restart()">Opnieuw Spelen 🔄</button>
    </div>

  </div>

  <script>
    var items = [
      { w: "patientia", c: "§ 1, r. 1 (Quo usque tandem abutere...)", r: "geduld", f: ["woede", "brutaliteit", "lijden"] },
      { w: "furor, furoris (m.)", c: "§ 1, r. 2 (furor iste tuus)", r: "razernij / woede", f: ["dapperheid", "trots", "wapens"] },
      { w: "audacia", c: "§ 1, r. 2 (effrenata iactabit audacia)", r: "overmoed / brutaliteit", f: ["angst", "voorzichtigheid", "eergevoel"] },
      { w: "praesidium", c: "§ 1, r. 3 (nocturnum praesidium)", r: "bescherming / wachtpost", f: ["legerkamp", "overwinning", "vergadering"] },
      { w: "vigiliae (v. mv.)", c: "§ 1, r. 3 (urbis vigiliae)", r: "nachtwachten", f: ["muren", "straten", "wapensmeden"] },
      { w: "timor, timoris (m.)", c: "§ 1, r. 3 (timor populi)", r: "angst / vrees", f: ["blijdschap", "trots", "lawaai"] },
      { w: "concursus, -us (m.)", c: "§ 1, r. 4 (concursus bonorum)", r: "samenloop / toeloop", f: ["vlucht", "uitverkoop", "vergissing"] },
      { w: "munitus (superlativus)", c: "§ 1, r. 4 (munitissimus locus)", r: "zeer zwaar versterkt / bewaakt", f: ["zeer heilig", "zeer afgelegen", "zeer smal"] },
      { w: "coniuratio, -onis (v.)", c: "§ 1, r. 6 (coniurationem tuam)", r: "samenzwering", f: ["overwinning", "redevoering", "vriendschap"] },
      { w: "arbitror, arbitrari", c: "§ 1, r. 8 (ignorare arbitraris)", r: "menen / denken", f: ["eisen", "weigeren", "bevelen"] },
      { w: "mores (m. mv.)", c: "§ 2, r. 9 (O tempora, o mores!)", r: "normen en waarden / zeden", f: ["doden", "wetten", "gebouwen"] },
      { w: "particeps (+ gen.)", c: "§ 2, r. 10 (publici consilii particeps)", r: "deelgenoot (aan)", f: ["leider (van)", "tegenstander (van)", "verrader (van)"] },
      { w: "caedes, caedis (v.)", c: "§ 2, r. 11 (ad caedem)", r: "moord / bloedbad", f: ["graf", "gevangenis", "verbanning"] },
      { w: "castra (o. mv.)", c: "§ 5, r. 15 (Castra sunt in Italia)", r: "legerkamp", f: ["burcht", "schepen", "tenten"] },
      { w: "hostis, hostis (m.)", c: "§ 5, r. 16 (hostium numerus)", r: "vijand (staatsvijand)", f: ["burger", "bondgenoot", "soldaat"] },
      { w: "moenia (o. mv.)", c: "§ 5, r. 17 (intra moenia)", r: "stadsmuren", f: ["tempels", "paleizen", "poorten"] },
      { w: "pernicies, -ei (v.)", c: "§ 5, r. 18 (perniciem rei publicae)", r: "ondergang / verderf", f: ["welvaart", "vrijheid", "geschiedenis"] }
    ];

    var deck = [];
    var cur = 0;
    var score = 0;
    var streak = 0;

    function shuffle(a) {
      var arr = a.slice();
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = arr[i];
        arr[i] = arr[j];
        arr[j] = temp;
      }
      return arr;
    }

    function start() {
      deck = shuffle(items).slice(0, 15);
      cur = 0;
      score = 0;
      streak = 0;
      document.getElementById("game-container").style.display = "block";
      document.getElementById("end-container").style.display = "none";
      loadQuestion();
    }

    function loadQuestion() {
      var q = deck[cur];
      document.getElementById("lbl-q").textContent = (cur + 1) + " / " + deck.length;
      document.getElementById("lbl-score").textContent = score;
      document.getElementById("lbl-streak").textContent = "🔥 " + streak;
      document.getElementById("lbl-word").textContent = q.w;
      document.getElementById("lbl-context").textContent = q.c;
      document.getElementById("lbl-feedback").textContent = "";
      document.getElementById("next-btn").style.display = "none";
      document.getElementById("p-bar").style.width = ((cur / deck.length) * 100) + "%";

      var grid = document.getElementById("opt-grid");
      grid.innerHTML = "";

      var opts = shuffle([q.r].concat(q.f));
      for (var i = 0; i < opts.length; i++) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "opt-btn";
        b.textContent = opts[i];
        b.setAttribute("data-val", opts[i]);
        b.onclick = function() {
          var chosen = this.getAttribute("data-val");
          var all = document.querySelectorAll(".opt-btn");
          for (var k = 0; k < all.length; k++) all[k].disabled = true;

          if (chosen === q.r) {
            this.className = "opt-btn correct-btn";
            streak++;
            var pts = 100 + (streak * 20);
            score += pts;
            document.getElementById("lbl-feedback").innerHTML = "<span style="color:#10b981;">✅ Uitstekend! +" + pts + " pt</span>";
          } else {
            this.className = "opt-btn wrong-btn";
            streak = 0;
            for (var m = 0; m < all.length; m++) {
              if (all[m].getAttribute("data-val") === q.r) all[m].className = "opt-btn correct-btn";
            }
            document.getElementById("lbl-feedback").innerHTML = "<span style="color:#ef4444;">❌ Juist: <b>" + q.r + "</b></span>";
          }
          document.getElementById("lbl-score").textContent = score;
          document.getElementById("lbl-streak").textContent = "🔥 " + streak;
          document.getElementById("next-btn").style.display = "inline-block";
        };
        grid.appendChild(b);
      }
    }

    function goNext() {
      cur++;
      if (cur < deck.length) {
        loadQuestion();
      } else {
        document.getElementById("p-bar").style.width = "100%";
        document.getElementById("game-container").style.display = "none";
        document.getElementById("end-container").style.display = "block";
        document.getElementById("lbl-final-score").textContent = score + " pt";
        document.getElementById("lbl-eval").textContent = score >= 2000 ? "👑 Imperator / Consul-niveau! Foutloos!" : (score >= 1400 ? "🏛️ Senator-niveau! Zeer sterk." : "📖 Goed geoefend!");
      }
    }

    function restart() {
      start();
    }

    // DIRECT AUTO-START OP LOAD
    start();
  </script>
</body>
</html>
